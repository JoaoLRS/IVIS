name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Análise de estilo (ESLint)
        run: npm run lint
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Testes unitários
        run: npm run test:unit

  api-ia:
    name: API de IA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-ia
    env:
      # Valor fictício, só para os testes. A chave real nunca passa pelo CI.
      IVIS_IA_CHAVE_SERVICO: chave-ficticia-de-ci-com-mais-de-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api-ia/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testes (pytest)
        run: python -m pytest tests --junitxml=resultados-pytest.xml
      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-api-ia
          path: api-ia/resultados-pytest.xml

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Permitir execução do Gradle Wrapper
        run: chmod +x gradlew
      - name: Testes (Gradle)
        run: ./gradlew test --no-daemon
      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-backend
          path: |
            backend/build/reports/tests
            backend/build/test-results

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - name: Formatação
        run: terraform fmt -check -recursive -diff
      - name: Inicializar sem o estado remoto
        run: terraform init -backend=false -input=false
      - name: Validar
        run: terraform validate

  segredos:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
