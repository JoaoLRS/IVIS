services:
  ivis-banco:
    image: postgres:17-alpine
    container_name: ivis-banco
    environment:
      POSTGRES_DB: ivis
      POSTGRES_USER: ${IVIS_BD_USUARIO:-ivis}
      # Valor padrão apenas para desenvolvimento local; defina outro no .env fora dele.
      POSTGRES_PASSWORD: ${IVIS_BD_SENHA:-ivis_local}
    ports:
      - "127.0.0.1:${IVIS_BD_PORTA:-5433}:5432"
    networks:
      - rede-banco
    volumes:
      - ivis-banco-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ivis-mailpit:
    image: axllent/mailpit:v1.27
    container_name: ivis-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - rede-banco
    restart: unless-stopped

  ivis-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ivis-backend
    environment:
      PORT: 8081
      IVIS_BD_URL: jdbc:postgresql://ivis-banco:5432/ivis
      IVIS_BD_USUARIO: ${IVIS_BD_USUARIO:-ivis}
      IVIS_BD_SENHA: ${IVIS_BD_SENHA:-ivis_local}
      IVIS_CORS_ORIGENS: ${IVIS_CORS_ORIGENS:-http://localhost:8080,http://localhost:5173}
      IVIS_JWT_CHAVE_ASSINATURA: ${IVIS_JWT_CHAVE_ASSINATURA:?Defina IVIS_JWT_CHAVE_ASSINATURA com pelo menos 32 bytes aleatórios codificados em Base64}
      IVIS_COOKIE_SEGURO: ${IVIS_COOKIE_SEGURO:-true}
      IVIS_LOGIN_TENTATIVAS_MAX: ${IVIS_LOGIN_TENTATIVAS_MAX:-10}
      IVIS_LOGIN_JANELA: ${IVIS_LOGIN_JANELA:-15m}
      IVIS_RECUPERACAO_TENTATIVAS_MAX: ${IVIS_RECUPERACAO_TENTATIVAS_MAX:-5}
      IVIS_RECUPERACAO_JANELA: ${IVIS_RECUPERACAO_JANELA:-15m}
      IVIS_RECUPERACAO_VALIDADE: ${IVIS_RECUPERACAO_VALIDADE:-30m}
      IVIS_URL_REDEFINICAO_SENHA: ${IVIS_URL_REDEFINICAO_SENHA:-http://localhost:8080/redefinir-senha}
      IVIS_EMAIL_REMETENTE: ${IVIS_EMAIL_REMETENTE:-no-reply@ivis.local}
      IVIS_SMTP_HOST: ivis-mailpit
      IVIS_SMTP_PORTA: 1025
      IVIS_IA_URL: http://ivis-api-ia:8000
      IVIS_IA_CHAVE_SERVICO: ${IVIS_IA_CHAVE_SERVICO:?Defina IVIS_IA_CHAVE_SERVICO no arquivo .env}
      IVIS_IA_TIMEOUT_PERGUNTA: ${IVIS_IA_TIMEOUT_PERGUNTA:-105s}
      IVIS_IA_TIMEOUT_AVALIACAO: ${IVIS_IA_TIMEOUT_AVALIACAO:-110s}
    ports:
      - "8081:8081"
    networks:
      - rede-banco
      - rede-ia
    depends_on:
      ivis-banco:
        condition: service_healthy
      ivis-api-ia:
        condition: service_healthy
      ivis-mailpit:
        condition: service_started
    restart: unless-stopped

  ivis-api-ia:
    build:
      context: ./api-ia
      dockerfile: Dockerfile
    container_name: ivis-api-ia
    env_file:
      - path: ./api-ia/.env
        required: false
    environment:
      IVIS_IA_CHAVE_SERVICO: ${IVIS_IA_CHAVE_SERVICO:?Defina IVIS_IA_CHAVE_SERVICO no arquivo .env}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - rede-ia
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/pronto', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    restart: unless-stopped

  ivis-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ivis-frontend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  ivis-banco-dados:

networks:
  rede-banco:
    internal: true
  rede-ia:
