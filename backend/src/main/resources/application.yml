spring:
  application:
    name: ivis-backend
  main:
    lazy-initialization: true
  datasource:
    url: ${IVIS_BD_URL:jdbc:postgresql://localhost:5432/ivis}
    username: ${IVIS_BD_USUARIO:ivis}
    # Sem valor padrão de propósito: a aplicação não sobe sem a senha informada.
    password: ${IVIS_BD_SENHA}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      initialization-fail-timeout: -1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${IVIS_SMTP_HOST:localhost}
    port: ${IVIS_SMTP_PORTA:1025}
    properties:
      mail:
        smtp:
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:${IVIS_PORTA:8081}}
  # O frontend já espera a base http://localhost:8081/api (clienteHttp.ts);
  # os controladores mapeiam /v1/..., resultando em /api/v1/...
  servlet:
    context-path: /api

ivis:
  jwt:
    # Base64 de pelo menos 32 bytes aleatórios; não definir segredo padrão.
    chave-assinatura: ${IVIS_JWT_CHAVE_ASSINATURA}
  sessao:
    cookie-seguro: ${IVIS_COOKIE_SEGURO:true}
  autenticacao:
    tentativas-login-maximas: ${IVIS_LOGIN_TENTATIVAS_MAX:10}
    janela-login: ${IVIS_LOGIN_JANELA:15m}
  recuperacao:
    tentativas-maximas: ${IVIS_RECUPERACAO_TENTATIVAS_MAX:5}
    janela: ${IVIS_RECUPERACAO_JANELA:15m}
    validade-token: ${IVIS_RECUPERACAO_VALIDADE:30m}
    url-redefinicao: ${IVIS_URL_REDEFINICAO_SENHA:http://localhost:8080/redefinir-senha}
  email:
    remetente: ${IVIS_EMAIL_REMETENTE:no-reply@ivis.local}
  cors:
    origens-permitidas: ${IVIS_CORS_ORIGENS:http://localhost:8080,http://localhost:5173,https://ivis-ia.vercel.app,https://ivis-b4s65t63k-lucifer-son.vercel.app}
  ia:
    url: ${IVIS_IA_URL:http://localhost:8000}
    chave-servico: ${IVIS_IA_CHAVE_SERVICO}
    timeout-pergunta: ${IVIS_IA_TIMEOUT_PERGUNTA:105s}
    timeout-avaliacao: ${IVIS_IA_TIMEOUT_AVALIACAO:110s}

logging:
  pattern:
    level: "%5p [%X{idRequisicao:-sem-id}]"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
