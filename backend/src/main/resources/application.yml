spring:
  application:
    name: ivis-backend
  datasource:
    url: ${IVIS_BD_URL:jdbc:postgresql://localhost:5432/ivis}
    username: ${IVIS_BD_USUARIO:ivis}
    # Sem valor padrão de propósito: a aplicação não sobe sem a senha informada.
    password: ${IVIS_BD_SENHA}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${IVIS_PORTA:8081}
  # O frontend já espera a base http://localhost:8081/api (clienteHttp.ts);
  # os controladores mapeiam /v1/..., resultando em /api/v1/...
  servlet:
    context-path: /api

ivis:
  cors:
    origens-permitidas: ${IVIS_CORS_ORIGENS:http://localhost:8080,http://localhost:5173}

logging:
  pattern:
    level: "%5p [%X{idRequisicao:-sem-id}]"
